name: Apply reviewed MEtanoia D1 migrations (remote)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact reviewed commit SHA"
        required: true
        type: string
      confirm_migrations:
        description: "Type APLICAR_MIGRATIONS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: metanoia-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact migration authorization
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM: ${{ inputs.confirm_migrations }}
        run: |
          [[ "$CONFIRM" == "APLICAR_MIGRATIONS" ]] || { echo "Migration confirmation missing."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full 40-character SHA is required."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - name: Review exact SQL files and production binding
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = ['0001_initial.sql', '0002_account_key_envelopes.sql'];
          const files = fs.readdirSync('migrations').filter(x => /^\d+_.+\.sql$/.test(x)).sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error('Unexpected migration set; refusing remote write.');
          const all = files.map(f => fs.readFileSync('migrations/' + f, 'utf8')).join('\n');
          if (/\b(DROP|TRUNCATE|ALTER\s+TABLE\s+.*\bDROP|DELETE\s+FROM)\b/i.test(all)) throw new Error('Destructive SQL detected; refusing remote write.');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const db = (cfg.d1_databases || []).filter(x => x.binding === 'DB');
          if (db.length !== 1 || db[0].database_name !== 'metanoia' || db[0].database_id !== '1af20f6e-bb1c-4f8f-b9e4-d71ca09279c0' || db[0].migrations_dir !== './migrations')
            throw new Error('D1 identity or migration directory mismatch; refusing remote write.');
          for (const f of expected) {
            const sql = fs.readFileSync('migrations/' + f, 'utf8');
            if (!/CREATE TABLE IF NOT EXISTS/i.test(sql)) throw new Error('Expected idempotent table creation missing in ' + f);
          }
          console.log('Preflight passed: exact two migrations, expected D1 identity, no destructive SQL.');
          NODE
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Verify D1 access and pending migrations
        run: wrangler d1 migrations list metanoia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply reviewed migrations in order
        run: wrangler d1 migrations apply metanoia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify remote tables, indexes and migration history
        run: node scripts/verify_d1_schema.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload post-migration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-d1-post-migration-audit
          path: d1-post-migration-report.md
          if-no-files-found: ignore
          retention-days: 30
