name: Cloudflare D1 read-only audit
on:
  workflow_dispatch:
  push:
    branches: [ deploy/cloudflare-metanoia-web ]
    paths:
      - "wrangler.jsonc"
      - "migrations/**"
      - "scripts/audit_cloudflare_d1.mjs"
      - ".github/workflows/cloudflare-d1-readonly.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "wrangler.jsonc"
      - "migrations/**"
      - "scripts/audit_cloudflare_d1.mjs"
      - ".github/workflows/cloudflare-d1-readonly.yml"
permissions:
  contents: read

concurrency:
  group: metonoia-d1-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare D1 using read-only API calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          METANOIA_REGISTRATION_KEY: ${{ secrets.METANOIA_REGISTRATION_KEY }}
        run: node scripts/audit_cloudflare_d1.mjs
      - name: Verify exported D1 integrity without remote writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          SQL_EXPORT="$RUNNER_TEMP/metonoia-d1-export.sql"
          SQLITE_DB="$RUNNER_TEMP/metonoia-d1-export.sqlite"
          trap 'rm -f "$SQL_EXPORT" "$SQLITE_DB"' EXIT
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          npm install --global wrangler@4
          wrangler d1 export metanoia --remote --skip-confirmation --output "$SQL_EXPORT"
          test -s "$SQL_EXPORT"
          sqlite3 "$SQLITE_DB" < "$SQL_EXPORT"
          INTEGRITY="$(sqlite3 "$SQLITE_DB" 'PRAGMA integrity_check;')"
          FOREIGN_KEYS="$(sqlite3 "$SQLITE_DB" 'PRAGMA foreign_keys=ON; PRAGMA foreign_key_check;')"
          if [[ "$INTEGRITY" != "ok" ]]; then
            echo "SQLite integrity_check failed: $INTEGRITY" >&2
            exit 1
          fi
          if [[ -n "$FOREIGN_KEYS" ]]; then
            echo "Foreign-key violations found in exported D1 database:" >&2
            echo "$FOREIGN_KEYS" >&2
            exit 1
          fi
          {
            echo "### Integridade física e referencial do D1"
            echo "- Export remoto somente leitura: concluído."
            echo "- SQLite PRAGMA integrity_check: **ok**."
            echo "- SQLite PRAGMA foreign_key_check: **zero violações**."
            echo "- Arquivo exportado removido do runner ao final."
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "| Integridade física via export SQLite | **APROVADA** | PRAGMA integrity_check=ok. |"
            echo "| Integridade referencial via export SQLite | **APROVADA** | PRAGMA foreign_key_check=zero violações. |"
          } >> d1-audit-report.md
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-cloudflare-d1-audit
          path: d1-audit-report.md
          if-no-files-found: ignore
          retention-days: 30
