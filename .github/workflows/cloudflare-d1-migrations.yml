name: Apply approved MEtanoia D1 migrations

on:
  push:
    branches: [deploy/cloudflare-metanoia-web]
    paths:
      - ".github/workflows/cloudflare-d1-migrations.yml"
      - "migrations/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metanoia-d1-approved-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate credentials and exact remote database identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const dbId = "1af20f6e-bb1c-4f8f-b9e4-d71ca09279c0";
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${dbId}`;
          async function call(url, init = {}) {
            const response = await fetch(url, { ...init, headers: { Authorization: `Bearer ${token}`, ...(init.headers || {}) } });
            const data = await response.json();
            if (!response.ok || data.success === false) throw new Error(`Cloudflare API HTTP ${response.status}: ${(data.errors || []).map(e => e.message).join("; ")}`);
            return data;
          }
          const info = await call(api);
          if (info.result?.uuid !== dbId || info.result?.name !== "metanoia") {
            throw new Error("D1 identity mismatch; migrations blocked.");
          }
          async function query(sql) {
            const data = await call(`${api}/query`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sql })
            });
            return data.result?.[0]?.results || [];
          }
          const tables = (await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")).map(x => x.name);
          const appTables = tables.filter(x => !x.startsWith("_cf_") && x !== "d1_migrations");
          const historyExists = tables.includes("d1_migrations");
          const applied = historyExists ? (await query("SELECT name FROM d1_migrations ORDER BY id")).map(x => x.name) : [];
          const initial = ["ai_conversations","ai_messages","ai_usage_daily","backups","consents","devices","records","sessions","sync_operations","users"].sort();
          const complete = [...initial, "account_key_envelopes"].sort();
          const same = (a,b) => JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
          const state0 = appTables.length === 0 && applied.length === 0;
          const state1 = same(appTables, initial) && same(applied, ["0001_initial.sql"]);
          const state2 = same(appTables, complete) && same(applied, ["0001_initial.sql","0002_account_key_envelopes.sql"]);
          if (!(state0 || state1 || state2)) {
            throw new Error(`Unexpected D1 state; safe migration gate stopped. app_tables=${appTables.length}; migration_history=${applied.join(",") || "empty"}.`);
          }
          console.log(`D1 identity confirmed; safe state=${state2 ? "already complete" : state1 ? "0001 applied; 0002 pending" : "empty; both pending"}.`);
          NODE

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Apply only the two reviewed migrations
        if: success()
        run: |
          wrangler d1 migrations apply metanoia --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify 11 application tables, 10 indexes, and both migration records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const dbId = "1af20f6e-bb1c-4f8f-b9e4-d71ca09279c0";
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${dbId}`;
          async function query(sql) {
            const response = await fetch(`${api}/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({ sql })
            });
            const data = await response.json();
            if (!response.ok || data.success === false) throw new Error(`D1 verification failed: HTTP ${response.status}`);
            return data.result?.[0]?.results || [];
          }
          const tables = await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name <> 'd1_migrations' ORDER BY name");
          const indexes = await query("SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name");
          const migrations = await query("SELECT name FROM d1_migrations ORDER BY id");
          const expected = ["0001_initial.sql","0002_account_key_envelopes.sql"];
          if (tables.length !== 11) throw new Error(`Expected 11 application tables; found ${tables.length}.`);
          if (indexes.length !== 10) throw new Error(`Expected 10 explicit indexes; found ${indexes.length}.`);
          if (JSON.stringify(migrations.map(x => x.name)) !== JSON.stringify(expected)) throw new Error("Remote migration history does not match the two approved files.");
          console.log("POST-MIGRATION AUDIT PASSED: 11 application tables, 10 explicit indexes, migrations 0001 and 0002 registered.");
          console.log("Tables: " + tables.map(x => x.name).join(", "));
          console.log("Indexes: " + indexes.map(x => x.name).join(", "));
          NODE
