name: Android build

concurrency:
  group: metanoia-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main, work/phase1-integrated-main, feature/intelligent-agenda-fasting-voice ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify debug APK signature and Android package metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -x "$APKSIGNER" || { echo "apksigner não encontrado." >&2; exit 1; }
          test -x "$AAPT" || { echo "aapt não encontrado." >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/metanoia-debug-cert.txt"
          CERT_SHA256=$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/metanoia-debug-cert.txt" | head -n1)
          test -n "$CERT_SHA256" || { echo "Certificado do APK não foi identificado." >&2; exit 1; }
          PACKAGE_INFO=$("$AAPT" dump badging "$APK" | grep -m1 "^package:")
          for expected in "name='br.com.metanoia.preview'" "versionCode='8'" "versionName='0.5.2-preview'"; do
            case "$PACKAGE_INFO" in *"$expected"*) ;; *) echo "Metadado inesperado: $expected" >&2; exit 1 ;; esac
          done
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "### APK debug verificado" >> "$GITHUB_STEP_SUMMARY"
          echo 'Package: br.com.metanoia.preview (instalação Preview independente)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Version code: 8' >> "$GITHUB_STEP_SUMMARY"
          echo 'Version name: 0.5.2-preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Debug certificate SHA-256: $CERT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Validate D1 migrations
        run: python3 scripts/validate_d1_migrations.py
      - name: Test matrimonial vault encryption
        run: node scripts/test_ingrid_vault.mjs
      - name: Validate PWA JavaScript
        run: node --check web/app.js && node --check web/sw.js && node --check web/crypto.js && node scripts/test_account_crypto.mjs
      - name: Validate Cloudflare Worker bundle
        run: |
          npm install --global wrangler
          node scripts/test_d1_api.mjs
          wrangler deploy --dry-run --outdir /tmp/metanoia-worker-bundle
      - name: Generate Gradle Wrapper for portable source
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Package complete source
        run: |
          git archive --format=zip --output=MEtanoia-codigo-fonte.zip HEAD
          zip -u MEtanoia-codigo-fonte.zip gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MEtanoia-Android.apk
      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-source-code
          path: MEtanoia-codigo-fonte.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-android-apk
          path: app/build/outputs/apk/debug/MEtanoia-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish durable release files
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MEtanoia Android — versão de teste
          prerelease: true
          overwrite_files: true
          files: |
            app/build/outputs/apk/debug/MEtanoia-Android.apk
            MEtanoia-codigo-fonte.zip


  release-signing:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/phase1-integrated-main' || github.ref == 'refs/heads/feature/intelligent-agenda-fasting-voice'
    runs-on: ubuntu-latest
    steps:
      - name: Check protected signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured; no release APK will be produced."
          fi
      - name: Checkout
        if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@v4
      - name: Set up Java
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore protected keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/metanoia-release.jks"
      - name: Inspect signing certificate without exposing private material
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          CERT_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/metanoia-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':')
          test -n "$CERT_SHA256" || { echo "Não foi possível ler o certificado da chave protegida." >&2; exit 1; }
          echo "Release keystore certificate SHA-256: $CERT_SHA256"
          echo "Release keystore certificate SHA-256: $CERT_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/metanoia-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify release APK signature and metadata
        if: steps.signing.outputs.available == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/metanoia-release-cert.txt"
          CERT_SHA256=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/metanoia-release-cert.txt" | head -n1)
          if [ -z "$CERT_SHA256" ]; then
            echo "Não foi possível obter o SHA-256 do certificado do APK." >&2
            exit 1
          fi
          PACKAGE_INFO=$("$AAPT" dump badging "$APK" | grep -m1 "^package:")
          for expected in "name='br.com.metanoia'" "versionCode='8'" "versionName='0.5.2'"; do
            case "$PACKAGE_INFO" in
              *"$expected"*) ;;
              *) echo "Metadado Android inesperado: $expected" >&2; exit 1 ;;
            esac
          done
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "### APK release assinado" >> "$GITHUB_STEP_SUMMARY"
          echo 'Package: br.com.metanoia' >> "$GITHUB_STEP_SUMMARY"
          echo 'Version code: 8' >> "$GITHUB_STEP_SUMMARY"
          echo 'Version name: 0.5.2' >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $CERT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Package source and release checksums
        if: steps.signing.outputs.available == 'true'
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          git archive --format=zip --output=MEtanoia-codigo-fonte.zip HEAD
          zip -u MEtanoia-codigo-fonte.zip gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          sha256sum app/build/outputs/apk/release/app-release.apk MEtanoia-codigo-fonte.zip > metonoia-release-SHA256SUMS.txt
      - name: Upload signed release and source package
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            MEtanoia-codigo-fonte.zip
            metonoia-release-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  room-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle connectedDebugAndroidTest --stacktrace && python3 scripts/capture_emulator_screens.py
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-room-instrumented-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real emulator screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-emulator-screens
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/phase1-integrated-main') || github.ref == 'refs/heads/work/phase1-integrated-main'
    needs: [build, room-integration]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download tested Preview APK
        uses: actions/download-artifact@v4
        with:
          name: metonoia-android-apk
          path: release
      - name: Publish only after build and emulator tests pass
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: MEtanoia Android Preview — 0.5.2-preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release/MEtanoia-Android.apk
