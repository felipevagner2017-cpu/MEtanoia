name: Android build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Package source code
        run: git archive --format=zip --output=MEtonoia-codigo-fonte.zip HEAD
      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: metanoia-source-code
          path: MEtonoia-codigo-fonte.zip
          if-no-files-found: error
      - name: Publish direct Android installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MEtonoia Android — versão de teste
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metanoia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
