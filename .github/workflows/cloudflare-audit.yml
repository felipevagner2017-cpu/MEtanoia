name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches: [feature/intelligent-agenda-fasting-voice]
    paths: ["scripts/cloudflare_audit.py", ".github/workflows/cloudflare-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect Cloudflare workers, domains, D1 and build logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare_audit.py
