name: Deploy MEtanoia PWA and Worker to Cloudflare (manual production gate)
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA already reviewed and validated"
        required: true
        type: string
      confirm_production:
        description: "Type PUBLICAR to authorize production deployment"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: metanoia-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit production confirmation
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRM: ${{ inputs.confirm_production }}
        run: |
          [[ "$CONFIRM" == "PUBLICAR" ]] || { echo "Production confirmation missing."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full 40-character commit SHA is required."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - name: Validate production bindings and secrets before any mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          METANOIA_REGISTRATION_KEY: ${{ secrets.METANOIA_REGISTRATION_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$METANOIA_REGISTRATION_KEY" || { echo "Missing METANOIA_REGISTRATION_KEY."; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc','utf8').replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\s)\/\/.*$/gm,'');
          const cfg = JSON.parse(text);
          if (cfg.name !== 'metanoia') throw new Error('Unexpected production Worker name.');
          if (cfg.ai?.binding !== 'AI') throw new Error('Workers AI binding AI is missing.');
          const db = (cfg.d1_databases || []).filter(x => x.binding === 'DB' && x.database_id && x.database_name);
          if (db.length !== 1) throw new Error('A real D1 binding DB with database_name and database_id must be configured before production.');
          if (!db[0].migrations_dir) throw new Error('d1_databases[DB].migrations_dir is required for read-only migration status checks.');
          NODE
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Check remote D1 migration status without applying migrations
        run: |
          DB_NAME="$(node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'));process.stdout.write(c.d1_databases.find(x=>x.binding==='DB').database_name)")"
          wrangler d1 migrations list "$DB_NAME" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate Worker bundle
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure invitation secret
        run: printf '%s' "$METANOIA_REGISTRATION_KEY" | wrangler secret put METANOIA_REGISTRATION_KEY
        env:
          METANOIA_REGISTRATION_KEY: ${{ secrets.METANOIA_REGISTRATION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy exact reviewed commit
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
