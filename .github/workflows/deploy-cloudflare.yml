name: Deploy MEtonoia PWA to Cloudflare Workers
on:
  push:
    branches: [main]
    paths: ["web/**", "wrangler.jsonc", ".github/workflows/deploy-cloudflare.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate Worker configuration
        run: wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
