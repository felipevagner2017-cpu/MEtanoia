name: Deploy isolated MEtanoia Preview
on:
  push:
    branches: [deploy/cloudflare-metanoia-web]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metanoia-cloudflare-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/cloudflare-metanoia-web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create or reuse isolated Preview D1, deploy Worker, and run remote sync/AI checks
        run: node scripts/deploy_cloudflare_preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Playwright and Chromium for real browser inspection
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect the deployed Preview in mobile and desktop browsers
        run: node scripts/capture_web_preview.mjs
        env:
          METANOIA_PREVIEW_URL: https://metanoia-preview.restaura-lar.workers.dev
      - name: Upload real Preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: metonoia-web-preview-screenshots
          path: artifacts/web-preview/
          if-no-files-found: error
          retention-days: 14
